<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrast Checker — Tamasrazim</title><meta name="description" content="Local-first color utility for contrast checker."><style>*{box-sizing:border-box}html{background:#070707;color:#f3f3f3}body{margin:0;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.shell{width:min(1180px,calc(100% - 32px));margin:auto}.top{border-bottom:1px solid #252525;padding:18px 0}.topin,.foot{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{text-decoration:none;font-weight:800;letter-spacing:.08em}.brand span,.foot{color:#8d8d8d}.nav a{color:#aaa;text-decoration:none}main{padding:54px 0 82px}.kicker{font-size:11px;letter-spacing:.16em;color:#8d8d8d;text-transform:uppercase}.hero h1{font:800 clamp(2.5rem,7vw,6rem)/.92 system-ui,sans-serif;letter-spacing:-.06em;margin:12px 0}.hero p{max-width:800px;color:#aaa}.panel{margin-top:24px;background:#0d0d0d;border:1px solid #292929;padding:18px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}input,textarea,select,button{font:inherit;color:#f3f3f3;background:#090909;border:1px solid #333;border-radius:7px;padding:9px}textarea{width:100%;min-height:170px}.out{margin-top:14px;padding:12px;border:1px dashed #373737;white-space:pre-wrap;overflow:auto;min-height:50px}.foot{border-top:1px solid #252525;padding:20px 0 35px}.foot a{color:#bbb}</style></head><body><header class="top"><div class="shell topin"><a class="brand" href="../../">TAMASRAZIM <span>/ Color</span></a><nav class="nav"><a href="../">Projects</a></nav></div></header><main class="shell"><div class="hero"><div class="kicker">Color</div><h1>Contrast Checker</h1><p>Local-first color utility for contrast checker.</p></div><section class="panel" id="app"></section></main><footer class="shell foot"><span>Local-first browser tool · no upload required</span><a href="../">Project index</a></footer><script>var TOOL={"kind":"color","mode":"contrast"};var app=document.getElementById('app');app.innerHTML='<input id="a" value="#ffffff"><input id="b" value="#000000"><button id="run">Calculate</button>';var o=document.createElement('pre');o.className='out';app.appendChild(o);function rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');return[0,2,4].map(function(i){return parseInt(h.slice(i,i+2),16)})}document.getElementById('run').onclick=function(){var a=rgb(document.getElementById('a').value),b=rgb(document.getElementById('b').value);if(TOOL.mode==='contrast'){function L(c){return c.map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i]},0)}o.textContent='Contrast: '+((Math.max(L(a),L(b))+.05)/(Math.min(L(a),L(b))+.05)).toFixed(2)+':1'}else o.textContent='RGB A: '+a.join(', ')+'\nRGB B: '+b.join(', ')};</script></body></html>
