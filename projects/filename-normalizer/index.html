<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filename Normalizer — Tamasrazim</title><style>body{margin:0;background:#050505;color:#eee;font:15px system-ui;padding:30px}main{max-width:950px;margin:auto}h1{font-size:clamp(2rem,6vw,5rem)}input,select,button{padding:11px;background:#0d0d0d;border:1px solid #333;color:#eee;border-radius:8px;margin:4px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.out{margin-top:20px;white-space:pre-wrap;font:12px/1.7 ui-monospace;color:#aaa}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><main><a href="../../" style="color:#888">← Tamasrazim</a><h1>Filename Normalizer</h1><p>Batch-preview clean filenames without renaming anything on disk.</p><input id="f" type="file" multiple><div class="row"><input id="prefix" placeholder="Prefix"><input id="suffix" placeholder="Suffix"><input id="sep" value="-" aria-label="Separator"></div><button id="go">Preview</button> <button id="copy">Copy list</button><div id="out" class="out"></div></main><script>
let result='';go.onclick=()=>{let p=prefix.value,s=suffix.value,z=sep.value||'-';result=[...f.files].map((x,i)=>{let ext=(x.name.match(/\.[^.]+$/)||[''])[0],stem=x.name.replace(/\.[^.]+$/,'').normalize('NFKD').replace(/[^\w]+/g,z).replace(new RegExp(''+z+'+','g'),z).replace(new RegExp('^'+z+'|'+z+'$','g'),'').toLowerCase();return (p?encode(p)+z:'')+stem+(s?z+encode(s):'')+ext.toLowerCase()}).join('\n');out.textContent=result};function encode(x){return x.normalize('NFKD').replace(/[^\w]+/g,sep.value||'-').replace(/^-+|-+$/g,'').toLowerCase()}copy.onclick=()=>navigator.clipboard?.writeText(result)</script></body></html>
