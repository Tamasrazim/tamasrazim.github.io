<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duplicate Finder — Tamasrazim</title><style>body{margin:0;background:#050505;color:#eee;font:15px system-ui;padding:30px}main{max-width:950px;margin:auto}h1{font-size:clamp(2rem,6vw,5rem)}button,input{padding:12px;border:1px solid #333;background:#0d0d0d;color:#eee;border-radius:8px}.group{border:1px solid #242424;padding:14px;margin:10px 0;border-radius:10px}.mono{font:12px ui-monospace;color:#aaa}</style></head><body><main><a href="../../" style="color:#888">← Tamasrazim</a><h1>Duplicate Finder</h1><p>Exact SHA-256 duplicate detection in the browser.</p><input id="f" type="file" multiple><button id="go">Scan</button><div id="out"></div></main><script>
go.onclick=async()=>{out.textContent='Hashing…';let map=new Map();for(let file of f.files){let h=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());let hex=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');if(!map.has(hex))map.set(hex,[]);map.get(hex).push(file.name)}let dup=[...map].filter(x=>x[1].length>1);out.innerHTML='<p>'+f.files.length+' files · '+dup.length+' duplicate groups</p>'+dup.map(([h,n])=>'<div class="group"><b>'+n.length+' copies</b><div class="mono">'+h+'<br>'+n.join('<br>')+'</div></div>').join('')}</script></body></html>
