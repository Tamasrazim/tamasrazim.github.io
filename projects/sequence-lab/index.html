<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sequence Lab — Tamasrazim</title><style>body{margin:0;background:#050505;color:#eee;font:15px system-ui;padding:30px}main{max-width:900px;margin:auto}h1{font-size:clamp(2rem,6vw,5rem)}input,button{padding:11px;background:#0d0d0d;border:1px solid #333;color:#eee;border-radius:8px}.item{padding:9px 11px;border:1px solid #222;margin:5px 0;border-radius:7px;background:#090909}.mono{font:12px ui-monospace;color:#aaa}</style></head><body><main><a href="../../" style="color:#888">← Tamasrazim</a><h1>Sequence Lab</h1><p>Turn an image sequence into a deterministic frame manifest.</p><input id="f" type="file" accept="image/*" multiple><button id="sort">Sort naturally</button><button id="export">Export manifest</button><div id="list" class="mono"></div></main><script>
let files=[];f.onchange=()=>{files=[...f.files];render()};sort.onclick=()=>{files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));render()};function render(){list.innerHTML=files.map((x,i)=>'<div class="item">'+String(i).padStart(5,'0')+' · '+x.name+'</div>').join('')};export.onclick=()=>{let data={frames:files.map((x,i)=>({index:i,filename:x.name,size:x.size,type:x.type}))};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='sequence-manifest.json';a.click()}</script></body></html>
