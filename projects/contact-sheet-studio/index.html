<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Sheet Studio — Tamasrazim</title><style>body{margin:0;background:#050505;color:#eee;font:15px system-ui;padding:30px}main{max-width:1100px;margin:auto}h1{font-size:clamp(2rem,6vw,5rem)}input,select,button{padding:11px;background:#0d0d0d;border:1px solid #333;color:#eee;border-radius:8px}canvas{width:100%;margin-top:20px;background:#fff}.bar{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><main><a href="../../" style="color:#888">← Tamasrazim</a><h1>Contact Sheet Studio</h1><p>Build a single review sheet from local images and export it as PNG.</p><div class="bar"><input id="f" type="file" accept="image/*" multiple><select id="cols"><option>4</option><option>5</option><option>6</option><option>8</option></select><button id="go">Build sheet</button><button id="save">Download PNG</button></div><canvas id="c"></canvas></main><script>
async function build(){let files=[...f.files];if(!files.length)return;let col=+cols.value,cell=260,row=Math.ceil(files.length/col),can=c.getContext('2d');c.width=col*cell;c.height=row*cell;can.fillStyle='#111';can.fillRect(0,0,c.width,c.height);for(let i=0;i<files.length;i++){let im=new Image();im.src=URL.createObjectURL(files[i]);await im.decode();let x=i%col*cell,y=Math.floor(i/col)*cell,sc=Math.min((cell-20)/im.naturalWidth,(cell-42)/im.naturalHeight);let w=im.naturalWidth*sc,h=im.naturalHeight*sc;can.drawImage(im,x+(cell-w)/2,y+8+(cell-42-h)/2,w,h);can.fillStyle='#fff';can.font='11px monospace';can.fillText(files[i].name.slice(0,36),x+8,y+cell-16)}}go.onclick=build;save.onclick=()=>{let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='contact-sheet.png';a.click()}</script></body></html>
