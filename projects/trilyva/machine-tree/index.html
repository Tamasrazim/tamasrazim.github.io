<style>
:root{color-scheme:dark;--bg:#050505;--ink:#f1f1ed;--muted:#969691;--line:#383838}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{padding:26px}.shell{width:min(1320px,100%);margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px}
.brand{font:600 11px ui-monospace,monospace;letter-spacing:.13em}.brand a{color:inherit;text-decoration:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.download{min-height:42px;padding:0 16px;border:1px solid #555;background:#111;color:var(--ink);font:600 10px ui-monospace,monospace;letter-spacing:.08em;text-decoration:none;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
button.primary{background:#f1f1ed;color:#050505;border-color:#f1f1ed}button:disabled{opacity:.4;cursor:wait}
.note{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font:10px/1.6 ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;margin:16px 0}
.stage{background:#080808;border:1px solid var(--line);padding:10px;overflow:auto}.stage img{display:block;width:100%;height:auto;background:#050505}
.status{font:11px/1.6 ui-monospace,monospace;color:var(--muted);margin:12px 0}
@media(max-width:650px){body{padding:14px}header{align-items:flex-start;flex-direction:column}.note{flex-direction:column}}
@page{size:A4 landscape;margin:0}
@media print{
 html,body{width:297mm;height:210mm;margin:0;padding:0;background:#050505!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .shell{width:297mm;height:210mm;max-width:none;margin:0}
 header,.note,.status{display:none!important}
 .stage{width:297mm;height:210mm;border:0;margin:0;padding:0;overflow:hidden;background:#050505}
 .stage img{width:297mm;height:210mm;object-fit:contain}
}

const status=document.getElementById("status"),poster=document.getElementById("poster"),download=document.getElementById("download"),printButton=document.getElementById("print");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
function wrap(value,max){const words=String(value??"").split(/\s+/),lines=[];let line="";for(const word of words){const next=line?line+" "+word:word;if(next.length>max&&line){lines.push(line);line=word;}else line=next;}if(line)lines.push(line);return lines;}
function txt(x,y,value,size,fill,weight="400",anchor="start"){return '<text x="'+x+'" y="'+y+'" font-family="Arial,Helvetica,sans-serif" font-size="'+size+'" fill="'+fill+'" font-weight="'+weight+'" text-anchor="'+anchor+'">'+esc(value)+'</text>';}
function multiline(x,y,value,max,size,fill,weight="400",leading=size*1.28){return wrap(value,max).map((line,i)=>txt(x,y+i*leading,line,size,fill,weight)).join("");}
function makeSvg(data){
 const W=2500,H=1760,margin=23,cardW=600,cardH=390,gapX=18,gapY=12,top=130,groups=["ENTRY & CONTROL","TIME & COMPOSITION","EDITING & RENDER","PROJECTS & PLATFORM"];
 let s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"><rect width="100%" height="100%" fill="#050505"/>';
 s+='<path d="M '+(W/2)+' 73 V 88 M '+(W/2)+' 88 H '+(margin+cardW/2)+' M '+(W/2)+' 88 H '+(W-margin-cardW/2)+'" stroke="#656565" stroke-width="1.5" fill="none"/>';
 s+='<rect x="'+margin+'" y="18" width="'+(W-2*margin)+'" height="54" rx="6" fill="#111" stroke="#656565"/>';
 s+=txt(margin+20,51,"TRILYVA",28,"#f1f1ed","700")+txt(margin+190,49,"COMPLETE MACHINE TREE",13,"#c5c5c0","600");
 s+=txt(W-margin-20,49,"TAMASRAZIM  /  MAIN BRANCH  /  697F2F6",10,"#888","500","end");
 for(let c=0;c<4;c++){const x=margin+c*(cardW+gapX),cx=x+cardW/2;s+='<path d="M '+cx+' 88 V 121" stroke="#686868" stroke-width="1.2"/>';s+='<rect x="'+x+'" y="95" width="'+cardW+'" height="26" rx="4" fill="#181818" stroke="#444"/>';s+=txt(x+12,112,["01 / "+groups[0],"02 / "+groups[1],"03 / "+groups[2],"04 / "+groups[3]][c],10,"#cfcfc9","600");}
 data.modules.forEach((m,index)=>{
  const c=Math.floor(index/4),r=index%4,x=margin+c*(cardW+gapX),y=top+r*(cardH+gapY);
  s+='<rect x="'+x+'" y="'+y+'" width="'+cardW+'" height="'+cardH+'" rx="7" fill="#0c0c0c" stroke="#474747"/>';
  s+='<rect x="'+(x+10)+'" y="'+(y+10)+'" width="34" height="24" rx="3" fill="#252525" stroke="#666"/>';
  s+=txt(x+27,y+27,m.num,10,"#f4f4ef","700","middle");
  s+=txt(x+55,y+26,m.title,13,"#f1f1ed","700");
  s+=multiline(x+55,y+43,m.sub,95,7.6,"#999","400",9);
  const routeY=y+63;
  s+='<rect x="'+(x+10)+'" y="'+routeY+'" width="'+(cardW-20)+'" height="23" rx="3" fill="#171717"/>';
  const route=(m.route||[]).map(v=>String(v));
  const cell=(cardW-30)/Math.max(1,route.length);
  route.forEach((v,i)=>{const rx=x+15+i*cell;s+=txt(rx+cell/2,routeY+15,v,7.2,"#c4c4c0","500","middle");if(i<route.length-1)s+=txt(rx+cell-2,routeY+15,"›",10,"#777","700","middle");});
  const innerX=x+10,innerY=y+94,innerW=cardW-20,branchGap=8,branchW=(innerW-2*branchGap)/3,branchH=cardH-104;
  (m.branches||[]).forEach((b,bi)=>{
   const bx=innerX+bi*(branchW+branchGap),by=innerY;
   s+='<rect x="'+bx+'" y="'+by+'" width="'+branchW+'" height="'+branchH+'" rx="4" fill="#121212" stroke="#333"/>';
   s+='<path d="M '+(bx+8)+' '+(by+25)+' h 22" stroke="#a2a29c" stroke-width="1.5"/>';
   s+=multiline(bx+8,by+17,b[0],27,8.3,"#e1e1dc","700",9.2);
   let ly=by+36;
   (b[1]||[]).forEach((leaf,li)=>{
    if(li)s+='<path d="M '+(bx+8)+' '+(ly-7)+' h '+(branchW-16)+'" stroke="#292929"/>';
    s+='<circle cx="'+(bx+9)+'" cy="'+(ly+1)+'" r="1.8" fill="#a0a09a"/>';
    const titleLines=wrap(leaf[0],28).slice(0,2),descLines=wrap(leaf[1],38).slice(0,4);
    titleLines.forEach((line,i)=>s+=txt(bx+16,ly+3+i*9,line,7.1,"#e0e0dc","600"));
    const dy=ly+titleLines.length*9+3;
    descLines.forEach((line,i)=>s+=txt(bx+16,dy+i*8,line,6.4,"#989893","400"));
    ly+=56;
   });
  });
 });
 s+=txt(W-24,H-13,"SYSTEM MAP · SNAPSHOT COMMIT 697F2F6 · 20 NOV 2026",8,"#777","500","end");
 s+="</svg>";return s;
}
async function start(){
 try{
  if(!("DecompressionStream" in window))throw new Error("This browser does not support gzip decompression. Please open this page in an up-to-date browser.");
  const raw=atob(packed),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const json=await new Response(stream).text(),data=JSON.parse(json),svg=makeSvg(data);
  const blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"}),url=URL.createObjectURL(blob);
  poster.onload=()=>{status.textContent="Vector tree ready · "+data.modules.length+" systems · A4 landscape";download.href=url;download.setAttribute("aria-disabled","false");printButton.disabled=false;};
  poster.onerror=()=>{status.textContent="Could not render the SVG tree.";};
  poster.src=url;
