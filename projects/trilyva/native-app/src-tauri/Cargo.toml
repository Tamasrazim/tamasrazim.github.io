[package]
name = "trilyva_native"
version = "0.1.0"
description = "Experimental native desktop shell for TRILYVA"
authors = ["Robiul Rumman Razim (Tamasrazim)"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
