<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Render QA — Tamasrazim</title><style>body{margin:0;background:#050505;color:#eee;font:15px system-ui;padding:30px}main{max-width:1000px;margin:auto}h1{font-size:clamp(2rem,6vw,5rem)}button,input{padding:12px;border:1px solid #333;background:#0d0d0d;color:#eee;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.card{border:1px solid #222;padding:16px;border-radius:10px;background:#090909}.value{font:700 1.3rem ui-monospace}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><main><a href="../../" style="color:#888">← Tamasrazim</a><h1>Render QA</h1><p>Inspect local image/video render properties before submission.</p><input id="f" type="file" accept="image/*,video/*"><div class="cards" id="cards"></div><pre id="raw" style="color:#aaa"></pre></main><script>
f.onchange=()=>{let x=f.files[0];if(!x)return;let c=[];c.push(['File',x.name],['Type',x.type||'unknown'],['Size',(x.size/1048576).toFixed(2)+' MB'],['Modified',new Date(x.lastModified).toLocaleString()]);if(x.type.startsWith('image/')){let i=new Image();i.onload=()=>{c.push(['Dimensions',i.naturalWidth+' × '+i.naturalHeight]);cards.innerHTML=c.map(a=>'<div class="card"><small>'+a[0]+'</small><div class="value">'+a[1]+'</div></div>').join('')};i.src=URL.createObjectURL(x)}else if(x.type.startsWith('video/')){let v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{c.push(['Dimensions',v.videoWidth+' × '+v.videoHeight],['Duration',v.duration.toFixed(3)+' s'],['FPS','browser metadata only']);cards.innerHTML=c.map(a=>'<div class="card"><small>'+a[0]+'</small><div class="value">'+a[1]+'</div></div>').join('')};v.src=URL.createObjectURL(x)}raw.textContent='Local inspection only.'}</script></body></html>
