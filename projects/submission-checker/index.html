<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submission Checker — Tamasrazim</title><style>body{margin:0;background:#050505;color:#eee;font:15px system-ui;padding:30px}main{max-width:950px;margin:auto}h1{font-size:clamp(2rem,6vw,5rem)}input,button{padding:12px;background:#0d0d0d;border:1px solid #333;color:#eee;border-radius:8px}.ok{color:#9dffb0}.warn{color:#ffd27d}.bad{color:#ff8d8d}.row{border-bottom:1px solid #222;padding:10px 0}.mono{font:12px ui-monospace;color:#aaa}</style></head><body><main><a href="../../" style="color:#888">← Tamasrazim</a><h1>Submission Checker</h1><p>Quick local preflight for stock-ready files and common naming mistakes.</p><input id="f" type="file" multiple><button id="go">Check</button><div id="out"></div></main><script>
go.onclick=()=>{let ex=['.jpg','.jpeg','.png','.mp4','.webm','.mov','.svg','.eps'];out.innerHTML=[...f.files].map(x=>{let ext=(x.name.match(/\.[^.]+$/)||[''])[0].toLowerCase(),name=x.name.replace(/\.[^.]+$/,'');let issues=[];if(!ex.includes(ext))issues.push('unsupported extension');if(/[<>:"/\\|?*]/.test(x.name))issues.push('unsafe filename');if(/\s{2,}/.test(name))issues.push('double spaces');if(name.length>120)issues.push('very long filename');let cls=issues.length?'warn':'ok';return '<div class="row '+cls+'"><b>'+x.name+'</b><br><span class="mono">'+(issues.join(' · ')||'PASS')+'</span></div>'}).join('')||'No files.'}</script></body></html>
