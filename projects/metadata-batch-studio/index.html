<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metadata Batch Studio — Tamasrazim</title><style>body{margin:0;background:#050505;color:#f3f3ef;font:15px system-ui;padding:30px}main{max-width:1000px;margin:auto}h1{font-size:clamp(2.2rem,6vw,5rem);line-height:.95}textarea,input{width:100%;box-sizing:border-box;background:#0c0c0c;color:#eee;border:1px solid #2a2a2a;border-radius:8px;padding:12px;margin:6px 0 16px}button{padding:12px 16px;border:1px solid #3a3a3a;background:#111;color:#fff;border-radius:8px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}small{color:#888}</style></head><body><main><a href="../../" style="color:#888">← Tamasrazim</a><h1>Metadata Batch Studio</h1><small>Build CSV metadata locally from a filename list.</small><label>Title template<input id="title" value="Translucent Geometric Flower"></label><label>Description<small> Use {name} for the filename stem.</small><textarea id="desc">Procedural {name} motion asset created for stock media and digital production workflows.</textarea><label>Keywords<textarea id="keys">abstract,animation,background,design,geometric,loop,motion,pattern,translucent,technology</textarea></label><label>Filenames<textarea id="files" placeholder="paste one filename per line"></textarea></label><button id="go">Generate CSV</button> <button id="copy">Copy CSV</button><pre id="out" style="white-space:pre-wrap;color:#aaa;margin-top:20px"></pre></main><script>
const esc=s=>'"'+String(s).replaceAll('"','""')+'"';let csv='';
go.onclick=()=>{let names=files.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),kw=keys.value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean).join(', ');csv='Filename,Title,Description,Keywords,Editorial,Mature Content\n'+names.map(f=>{let name=f.replace(/\.[^.]+$/,'');let t=title.value.replaceAll('{name}',name);let d=desc.value.replaceAll('{name}',name);return [f,t,d,kw,'No','No'].map(esc).join(',')}).join('\n');out.textContent=csv};copy.onclick=()=>navigator.clipboard?.writeText(csv)</script></body></html>
