<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palette Extractor — Tamasrazim</title><style>body{margin:0;background:#050505;color:#eee;font:15px system-ui;padding:30px}main{max-width:950px;margin:auto}h1{font-size:clamp(2rem,6vw,5rem)}input,button{padding:12px;background:#0d0d0d;border:1px solid #333;color:#eee;border-radius:8px}.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:20px}.sw{aspect-ratio:1;border-radius:6px;border:1px solid #222;position:relative}.sw span{position:absolute;left:5px;right:5px;bottom:5px;font:9px ui-monospace;background:#000b;padding:3px;text-align:center}@media(max-width:700px){.palette{grid-template-columns:repeat(4,1fr)}}</style></head><body><main><a href="../../" style="color:#888">← Tamasrazim</a><h1>Palette Extractor</h1><p>Extract a practical color set from an image without sending the file anywhere.</p><input id="f" type="file" accept="image/*"><div id="palette" class="palette"></div><button id="copy">Copy palette</button></main><script>
let colors=[];f.onchange=()=>{let i=new Image();i.onload=()=>{let c=document.createElement('canvas'),w=80,h=Math.max(1,Math.round(i.naturalHeight/i.naturalWidth*80));c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);let d=c.getContext('2d').getImageData(0,0,w,h).data,map=new Map();for(let p=0;p<d.length;p+=4){if(d[p+3]<200)continue;let r=d[p]>>4,g=d[p+1]>>4,b=d[p+2]>>4,k=(r<<8)|(g<<4)|b;map.set(k,(map.get(k)||0)+1)}colors=[...map.entries()].sort((a,b)=>b[1]-a[1]).slice(0,16).map(([k])=>[k>>8,(k>>4)&15,k&15].map(v=>v*17));palette.innerHTML=colors.map(v=>{let h='#'+v.map(x=>x.toString(16).padStart(2,'0')).join('');return '<div class="sw" style="background:'+h+'"><span>'+h+'</span></div>'}).join('')};i.src=URL.createObjectURL(f.files[0])};copy.onclick=()=>navigator.clipboard?.writeText(colors.map(v=>'#'+v.map(x=>x.toString(16).padStart(2,'0')).join('')).join('\n'))</script></body></html>
