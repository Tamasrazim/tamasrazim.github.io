<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metadata Diff — Tamasrazim</title><meta name="description" content="Local-first stock qa utility for metadata diff."><style>*{box-sizing:border-box}html{background:#070707;color:#f3f3f3}body{margin:0;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.shell{width:min(1180px,calc(100% - 32px));margin:auto}.top{border-bottom:1px solid #252525;padding:18px 0}.topin,.foot{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{text-decoration:none;font-weight:800;letter-spacing:.08em}.brand span,.foot{color:#8d8d8d}.nav a{color:#aaa;text-decoration:none}main{padding:54px 0 82px}.kicker{font-size:11px;letter-spacing:.16em;color:#8d8d8d;text-transform:uppercase}.hero h1{font:800 clamp(2.5rem,7vw,6rem)/.92 system-ui,sans-serif;letter-spacing:-.06em;margin:12px 0}.hero p{max-width:800px;color:#aaa}.panel{margin-top:24px;background:#0d0d0d;border:1px solid #292929;padding:18px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}input,textarea,select,button{font:inherit;color:#f3f3f3;background:#090909;border:1px solid #333;border-radius:7px;padding:9px}textarea{width:100%;min-height:170px}.out{margin-top:14px;padding:12px;border:1px dashed #373737;white-space:pre-wrap;overflow:auto;min-height:50px}.foot{border-top:1px solid #252525;padding:20px 0 35px}.foot a{color:#bbb}</style></head><body><header class="top"><div class="shell topin"><a class="brand" href="../../">TAMASRAZIM <span>/ Stock QA</span></a><nav class="nav"><a href="../">Projects</a></nav></div></header><main class="shell"><div class="hero"><div class="kicker">Stock QA</div><h1>Metadata Diff</h1><p>Local-first stock qa utility for metadata diff.</p></div><section class="panel" id="app"></section></main><footer class="shell foot"><span>Local-first browser tool · no upload required</span><a href="../">Project index</a></footer><script>var TOOL={"kind":"textdiff","mode":"diff"};var app=document.getElementById('app');app.innerHTML='<div class="row"><textarea id="a"></textarea><textarea id="b"></textarea></div><button id="run">Compare</button>';var o=document.createElement('pre');o.className='out';app.appendChild(o);document.getElementById('run').onclick=function(){var A=document.getElementById('a').value.split('\n'),B=document.getElementById('b').value.split('\n'),r=[];for(var i=0;i<Math.max(A.length,B.length);i++)if(A[i]!==B[i])r.push('A: '+(A[i]||'')+' | B: '+(B[i]||''));o.textContent=r.join('\n')||'No differences.'};</script></body></html>
