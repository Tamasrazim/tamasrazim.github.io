<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Blur Preview — Tamasrazim</title><meta name="description" content="Local-first image utility for image blur preview."><style>*{box-sizing:border-box}html{background:#070707;color:#f3f3f3}body{margin:0;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.shell{width:min(1180px,calc(100% - 32px));margin:auto}.top{border-bottom:1px solid #252525;padding:18px 0}.topin,.foot{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{text-decoration:none;font-weight:800;letter-spacing:.08em}.brand span,.foot{color:#8d8d8d}.nav a{color:#aaa;text-decoration:none}main{padding:54px 0 82px}.kicker{font-size:11px;letter-spacing:.16em;color:#8d8d8d;text-transform:uppercase}.hero h1{font:800 clamp(2.5rem,7vw,6rem)/.92 system-ui,sans-serif;letter-spacing:-.06em;margin:12px 0}.hero p{max-width:800px;color:#aaa}.panel{margin-top:24px;background:#0d0d0d;border:1px solid #292929;padding:18px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}input,textarea,select,button{font:inherit;color:#f3f3f3;background:#090909;border:1px solid #333;border-radius:7px;padding:9px}textarea{width:100%;min-height:170px}.out{margin-top:14px;padding:12px;border:1px dashed #373737;white-space:pre-wrap;overflow:auto}.foot{border-top:1px solid #252525;padding:20px 0 35px}.foot a{color:#bbb}</style></head><body><header class="top"><div class="shell topin"><a class="brand" href="../../">TAMASRAZIM <span>/ Image</span></a><nav class="nav"><a href="../">Projects</a></nav></div></header><main class="shell"><div class="hero"><div class="kicker">Image</div><h1>Image Blur Preview</h1><p>Local-first image utility for image blur preview.</p></div><section class="panel" id="app"></section></main><footer class="shell foot"><span>Local-first browser tool · no upload required</span><a href="../">Project index ↑</a></footer><script>var TOOL={"kind":"media","mode":"image-blur"};var app=document.getElementById('app');
function out(){var x=document.createElement('pre');x.className='out';app.appendChild(x);return x}
if(TOOL.kind==='calc'){app.innerHTML='<div class="row"><input id="a" type="number" value="10"><input id="b" type="number" value="5"><input id="n" type="number" value="60"><button id="run">Run</button></div>';var o=out();document.getElementById('run').onclick=function(){var a=+document.getElementById('a').value,b=+document.getElementById('b').value,n=+document.getElementById('n').value,m=TOOL.mode;if(m==='easing')o.textContent=Array.from({length:11},function(_,i){var t=i/10;return t.toFixed(2)+' '+(t*t*(3-2*t)).toFixed(4)}).join('\n');else if(m==='bezier')o.textContent=Array.from({length:11},function(_,i){var t=i/10;return t.toFixed(2)+' '+(3*(1-t)*t*t+t*t*t).toFixed(4)}).join('\n');else if(m==='angle')o.textContent='0-360: '+(((a%360)+360)%360)+'\n-180-180: '+((((a+180)%360)+360)%360-180);else if(m==='rotation')o.textContent='Shortest delta: '+((((b-a+180)%360)+360)%360-180);else if(m==='phase')o.textContent='Phase: '+((a%n)/n).toFixed(6);else if(m==='batch')o.textContent='Full: '+Math.floor(a/n)+'\nRemainder: '+(a%n);else o.textContent='A+B: '+(a+b)+'\nA-B: '+(a-b)+'\nA*B: '+(a*b)+'\nA/B: '+(b?a/b:'undefined')}}
if(TOOL.kind==='media'){app.innerHTML='<input id="file" type="file"><div id="meta" class="out">Choose a file.</div>';var o=document.getElementById('meta'),f=document.getElementById('file');f.onchange=function(){var x=f.files[0],u=URL.createObjectURL(x),mode=TOOL.mode;if(mode.indexOf('image')===0){var im=new Image();im.onload=function(){o.textContent='Image '+im.naturalWidth+'x'+im.naturalHeight+' bytes '+x.size};im.src=u}else if(mode.indexOf('video')===0){var v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=function(){o.textContent='Video '+v.videoWidth+'x'+v.videoHeight+' duration '+v.duration.toFixed(2)+'s'};v.src=u}else{var a=document.createElement('audio');a.onloadedmetadata=function(){o.textContent='Audio duration '+a.duration.toFixed(2)+'s'};a.src=u}}}</script></body></html>
