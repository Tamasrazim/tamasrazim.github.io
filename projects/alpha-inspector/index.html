<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha Inspector — Tamasrazim</title><style>body{margin:0;background:#050505;color:#eee;font:15px system-ui;padding:30px}main{max-width:950px;margin:auto}h1{font-size:clamp(2rem,6vw,5rem)}input,button{padding:12px;background:#0d0d0d;border:1px solid #333;color:#eee;border-radius:8px}canvas{max-width:100%;margin-top:20px;background:repeating-conic-gradient(#222 0 25%,#111 0 50%) 0/20px 20px}.stat{margin-top:18px;font:14px ui-monospace;color:#aaa}</style></head><body><main><a href="../../" style="color:#888">← Tamasrazim</a><h1>Alpha Inspector</h1><p>Measure transparent pixels, opaque coverage and image dimensions locally.</p><input id="f" type="file" accept="image/*"><canvas id="c"></canvas><div id="out" class="stat"></div></main><script>
f.onchange=()=>{let x=f.files[0];if(!x)return;let i=new Image();i.onload=()=>{let w=i.naturalWidth,h=i.naturalHeight;c.width=w;c.height=h;let g=c.getContext('2d');g.drawImage(i,0,0);let d=g.getImageData(0,0,w,h).data,transparent=0,opaque=0;for(let p=3;p<d.length;p+=4){if(d[p]===0)transparent++;if(d[p]>=250)opaque++}let n=w*h;out.innerHTML=`Dimensions: ${w} × ${h}<br>Transparent: ${(transparent/n*100).toFixed(2)}%<br>Opaque: ${(opaque/n*100).toFixed(2)}%<br>Alpha-bearing pixels: ${(n-transparent).toLocaleString()}`};i.src=URL.createObjectURL(x)}</script></body></html>
