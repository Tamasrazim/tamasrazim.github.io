<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Batch Resizer — Tamasrazim</title><meta name="description" content="Resize a local image batch to exact pixel dimensions and export each result as a PNG from the browser."><style>
:root{color-scheme:dark;--bg:#070707;--fg:#f4f4f4;--muted:#9b9b9b;--line:#242424;--panel:#0f0f0f}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{min-height:100vh}a{color:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:auto}.top{border-bottom:1px solid var(--line);padding:18px 0}.topin{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{text-decoration:none;font-weight:800;letter-spacing:.08em}.brand span{color:var(--muted);font-weight:400}.nav a{color:var(--muted);text-decoration:none}.nav a:hover{color:var(--fg)}main{padding:54px 0 80px}.kicker{color:var(--muted);font-size:12px;letter-spacing:.18em;text-transform:uppercase}.hero{margin:14px 0 34px}.hero h1{font:800 clamp(2.5rem,7vw,6rem)/.92 ui-sans-serif,system-ui;margin:0;letter-spacing:-.05em}.hero p{max-width:780px;color:var(--muted);margin:18px 0 0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.panel{grid-column:span 12;background:var(--panel);border:1px solid var(--line);padding:20px;position:relative;overflow:hidden}.panel.half{grid-column:span 6}.panel h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:6px;min-width:150px;flex:1}.field.wide{flex:3}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}input,textarea,select,button{font:inherit;background:#090909;color:var(--fg);border:1px solid #303030;border-radius:8px;padding:10px 11px;outline:none}textarea{min-height:150px;resize:vertical;width:100%}input:focus,textarea:focus,select:focus,button:focus{border-color:#8a8a8a}button{cursor:pointer;font-weight:700}button:hover{background:#161616}.muted{color:var(--muted)}.result{margin-top:14px;padding:14px;border:1px dashed #343434;white-space:pre-wrap;overflow:auto}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{border:1px solid var(--line);padding:12px}.stat b{display:block;font-size:20px}.list{display:grid;gap:8px;margin-top:12px}.item{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);padding:9px 10px}.ok{border-color:#666}.warn{border-color:#8d7a32}.bad{border-color:#8b3939}.small{font-size:12px}.footer{border-top:1px solid var(--line);padding:20px 0 36px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}@media(max-width:760px){.panel.half{grid-column:span 12}.statgrid{grid-template-columns:repeat(2,1fr)}main{padding-top:34px}.hero h1{font-size:clamp(2.4rem,14vw,4rem)}}
</style></head><body><header class="top"><div class="shell topin"><a class="brand" href="../../">TAMASRAZIM <span>/ 23 · IMAGE</span></a><nav class="nav"><a href="../">Projects</a></nav></div></header><main class="shell"><div class="hero"><div class="kicker">23 · IMAGE</div><h1>Image Batch Resizer</h1><p>Resize a local image batch to exact pixel dimensions and export each result as a PNG from the browser.</p></div><section class="grid"><div class="panel"><h2>Batch</h2><div class="row"><div class="field wide"><label>Images</label><input id="files" type="file" accept="image/*" multiple></div><div class="field"><label>Width</label><input id="w" type="number" value="1920"></div><div class="field"><label>Height</label><input id="h" type="number" value="1080"></div></div><div class="row" style="margin-top:10px"><button id="run">Prepare exports</button><span class="muted small">Results stay local until you download them.</span></div><div id="out" class="list"></div></div></section></main><footer class="shell footer"><span>Local-first browser tool · no upload required</span><a href="../">Project index ↑</a></footer><script>const files=document.querySelector('#files'),w=document.querySelector('#w'),h=document.querySelector('#h'),run=document.querySelector('#run'),out=document.querySelector('#out');let selected=[];files.onchange=()=>selected=[...files.files];run.onclick=async()=>{out.innerHTML='';for(const f of selected){const url=URL.createObjectURL(f);const img=new Image();await new Promise(r=>{img.onload=r;img.src=url});const c=document.createElement('canvas');c.width=+w.value;c.height=+h.value;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(blob=>{const a=document.createElement('a');a.download=f.name.replace(/\.[^.]+$/,'')+'-'+c.width+'x'+c.height+'.png';a.href=URL.createObjectURL(blob);a.textContent='Download '+a.download;a.className='item';out.appendChild(a)},'image/png')}};</script></body></html>
