<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Diff Lab — Tamasrazim</title><style>
:root{--b:#050505;--w:#f3f3ef;--m:#888;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--w);padding:32px}main{max-width:1100px;margin:auto}h1{font-size:clamp(2rem,6vw,4.6rem);line-height:.95;margin:0 0 12px}p{color:var(--m);line-height:1.7}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.pick,button{padding:11px 14px;border:1px solid #333;border-radius:8px;background:#0d0d0d;color:var(--w);cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid #222;border-radius:12px;padding:14px;background:#090909}.panel img,canvas{width:100%;height:360px;object-fit:contain;background:#111;border-radius:8px}.report{margin-top:16px;white-space:pre-wrap;font:12px/1.6 ui-monospace,monospace;color:#bbb}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="../../" style="color:#aaa">← Tamasrazim</a><h1>Asset Diff Lab</h1><p>Compare two rendered images locally. No upload, no backend.</p><div class="bar"><label class="pick">Asset A <input id="a" type="file" accept="image/*" hidden></label><label class="pick">Asset B <input id="b" type="file" accept="image/*" hidden></label><button id="run">Analyze difference</button></div><div class="grid"><div class="panel"><b>Asset A</b><img id="ia" alt=""></div><div class="panel"><b>Asset B</b><img id="ib" alt=""></div></div><div class="panel" style="margin-top:16px"><b>Diff map</b><canvas id="diff"></canvas></div><div id="report" class="report"></div></main><script>
const A=document.querySelector('#a'),B=document.querySelector('#b'),ia=document.querySelector('#ia'),ib=document.querySelector('#ib'),c=document.querySelector('#diff'),r=document.querySelector('#report');
function show(i,e){if(e.files[0]){let u=URL.createObjectURL(e.files[0]);i.src=u}}
A.onchange=()=>show(ia,A);B.onchange=()=>show(ib,B);
run.onclick=async()=>{if(!A.files[0]||!B.files[0])return r.textContent='Select both assets.';let x=new Image(),y=new Image();x.src=ia.src;y.src=ib.src;await Promise.all([x.decode(),y.decode()]);let w=Math.max(x.naturalWidth,y.naturalWidth),h=Math.max(x.naturalHeight,y.naturalHeight);c.width=w;c.height=h;let ca=document.createElement('canvas'),cb=document.createElement('canvas');ca.width=cb.width=w;ca.height=cb.height=h;ca.getContext('2d').drawImage(x,0,0);cb.getContext('2d').drawImage(y,0,0);let ad=ca.getContext('2d').getImageData(0,0,w,h).data,bd=cb.getContext('2d').getImageData(0,0,w,h).data,od=c.getContext('2d').createImageData(w,h);let changed=0,total=0;for(let i=0;i<od.data.length;i+=4){let d=Math.abs(ad[i]-bd[i])+Math.abs(ad[i+1]-bd[i+1])+Math.abs(ad[i+2]-bd[i+2])+Math.abs(ad[i+3]-bd[i+3]);if(d>15){changed++;od.data[i]=255;od.data[i+1]=255;od.data[i+2]=255;od.data[i+3]=220}else od.data[i+3]=20;total+=d}c.getContext('2d').putImageData(od,0,0);r.textContent=`A: ${x.naturalWidth}×${x.naturalHeight}\nB: ${y.naturalWidth}×${y.naturalHeight}\nChanged pixels: ${changed.toLocaleString()} / ${w*h.toLocaleString()}\nDifference score: ${(total/(w*h*1020)).toFixed(5)}`};
</script></body></html>
