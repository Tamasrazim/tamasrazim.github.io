name: Build Spiral Mic Native

on:
  push:
    paths:
      - "projects/spiral-mic/native/**"
      - "projects/spiral-mic/ui/**"
      - "projects/spiral-mic/.github/workflows/build-native.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/spiral-mic/native
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --locked

      - name: Check
        run: cargo check

      - name: Build Windows installers
        run: cargo tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: spiral-mic-windows
          path: |
            projects/spiral-mic/native/target/release/bundle/nsis/*.exe
            projects/spiral-mic/native/target/release/bundle/msi/*.msi
