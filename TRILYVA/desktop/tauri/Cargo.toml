# Rust application and local media backend for TRILYVA.
[package]
name = "trilyva-desktop"
version = "0.1.0"
description = "TRILYVA motion rendering and media export"
authors = ["Tamasrazim"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "trilyva_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7" }

[dependencies]
tauri = { version = "2.12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
rfd = "0.15"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
