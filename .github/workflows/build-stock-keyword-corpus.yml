name: Build stock keyword corpus
on:
  push:
    paths:
      - ".github/workflows/build-stock-keyword-corpus.yml"
      - "projects/code-motion/renderer/tools/build-stock-keyword-corpus.mjs"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate corpus
        run: node projects/code-motion/renderer/tools/build-stock-keyword-corpus.mjs
      - name: Commit corpus and remove builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/code-motion/renderer/library/stock-keyword-corpus-1m.txt
          git rm projects/code-motion/renderer/tools/build-stock-keyword-corpus.mjs .github/workflows/build-stock-keyword-corpus.yml
          git commit -m "TRILYVA: add 1M-word stock keyword research corpus"
          git push
