name: KYNESTRA Tauri CI

on:
  push:
    paths:
      - "KYNESTRA/**"
  pull_request:
    paths:
      - "KYNESTRA/**"
  workflow_dispatch:

jobs:
  tauri:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: KYNESTRA/desktop/tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test

      - name: Check build
        run: cargo check
