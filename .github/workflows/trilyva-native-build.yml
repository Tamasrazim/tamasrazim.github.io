name: TRILYVA Native Build

on:
  workflow_dispatch:
  push:
    branches: [main, trilyva/native-desktop-foundation]
    paths:
      - "projects/code-motion/renderer/**"
      - "projects/trilyva/native-app/**"
      - ".github/workflows/trilyva-native-build.yml"
  pull_request:
    paths:
      - "projects/code-motion/renderer/**"
      - "projects/trilyva/native-app/**"
      - ".github/workflows/trilyva-native-build.yml"

permissions:
  contents: read

concurrency:
  group: trilyva-native-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: trilyva-windows
          - os: macos-latest
            artifact: trilyva-macos
          - os: ubuntu-22.04
            artifact: trilyva-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/trilyva/native-app/package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate native bridge JavaScript
        run: node --check projects/code-motion/renderer/native-voice-engine.js

      - name: Validate native manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('projects/trilyva/native-app/package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('projects/trilyva/native-app/src-tauri/tauri.conf.json', 'utf8'))"
          node -e "const fs=require('fs'),path=require('path');const base='projects/trilyva/native-app/src-tauri';const cfg=JSON.parse(fs.readFileSync(path.join(base,'tauri.conf.json'),'utf8'));const web=path.resolve(base,cfg.build.frontendDist);if(!fs.existsSync(path.join(web,'index.html')))throw new Error('Tauri frontendDist does not contain index.html');if(!fs.existsSync(path.join(web,'native-voice-engine.js')))throw new Error('Native voice bridge is missing from the packaged renderer');const icon=fs.readFileSync('projects/trilyva/native-app/icon.svg','utf8');if(!icon.includes('<svg')||!icon.includes('</svg>'))throw new Error('TRILYVA app icon SVG is missing or malformed');console.log('Frontend and app icon sources OK:',web)"

      - name: Install desktop dependencies
        working-directory: projects/trilyva/native-app
        run: npm install

      - name: Build native bundles
        working-directory: projects/trilyva/native-app
        run: npm run tauri:build

      - name: Upload native build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: projects/trilyva/native-app/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14
