name: KYNESTRA Windows Installer

on:
  push:
    branches:
      - "kynestra-build"
    tags:
      - "kynestra-v*"
    paths-ignore:
      - "KYNESTRA/releases/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: KYNESTRA/desktop/tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test

      - name: Build and publish installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: KYNESTRA/desktop/tauri
          tagName: kynestra-v__VERSION__
          releaseName: KYNESTRA v__VERSION__
          releaseBody: |
            Windows installer for KYNESTRA.

            Download the KYNESTRA setup executable and run it to install the desktop app.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: --bundles nsis
          releaseAssetNamePattern: KYNESTRA[setup].[ext]

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $installer = Get-ChildItem "KYNESTRA/desktop/tauri/target/release/bundle/nsis/*-setup.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced."
          }
          Copy-Item $installer.FullName "KYNESTRA/desktop/tauri/target/release/bundle/nsis/KYNESTRA-Setup.exe" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KYNESTRA-Windows-Installer
          path: KYNESTRA/desktop/tauri/target/release/bundle/nsis/KYNESTRA-Setup.exe
          if-no-files-found: error
      - name: Commit installer to repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force "KYNESTRA/releases" | Out-Null
          Copy-Item "KYNESTRA/desktop/tauri/target/release/bundle/nsis/KYNESTRA-Setup.exe" "KYNESTRA/releases/KYNESTRA-Setup.exe" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "KYNESTRA/releases/KYNESTRA-Setup.exe"
          if (-not (git diff --cached --quiet)) {
            git commit -m "build: publish KYNESTRA Windows installer"
            git push
          }
