name: KYNESTRA Windows Installer

on:
  push:
    branches:
      - "kynestra-build"
    tags:
      - "kynestra-v*"
    paths-ignore:
      - "KYNESTRA/releases/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kynestra-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    defaults:
      run:
        working-directory: KYNESTRA/desktop/tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "2.12.0" --locked

      - name: Generate Windows app icons
        run: cargo tauri icon icons/kynestra-source.svg

      - name: Generate Cargo.lock for this build
        run: cargo generate-lockfile

      - name: Prepare Windows code signing
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          New-Item -ItemType Directory -Force "certificate" | Out-Null
          Set-Content -Path "certificate/certificate.txt" -Value $env:WINDOWS_CERTIFICATE -NoNewline
          certutil -decode "certificate/certificate.txt" "certificate/certificate.pfx" | Out-Null
          Remove-Item "certificate/certificate.txt" -Force

          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath "certificate/certificate.pfx" -CertStoreLocation "Cert:\CurrentUser\My" -Password $password

          if (-not $cert) { throw "Windows code-signing certificate could not be imported." }
          $thumbprint = ($cert | Select-Object -First 1).Thumbprint
          if (-not $thumbprint) { throw "Imported certificate has no thumbprint." }
          if (-not $env:WINDOWS_TIMESTAMP_URL) { throw "WINDOWS_TIMESTAMP_URL is required when code signing is enabled." }

          $configPath = "tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if (-not $config.bundle.windows) {
            $config.bundle | Add-Member -MemberType NoteProperty -Name windows -Value ([pscustomobject]@{})
          }
          $config.bundle.windows.certificateThumbprint = $thumbprint
          $config.bundle.windows.digestAlgorithm = "sha256"
          $config.bundle.windows.timestampUrl = $env:WINDOWS_TIMESTAMP_URL
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8
          Write-Host "Windows signing prepared for certificate $thumbprint"

      - name: Run tests
        run: cargo test --locked

      - name: Build NSIS installer
        run: cargo tauri build --bundles nsis -- --locked

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis/*-setup.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced."
          }
          Copy-Item $installer.FullName "target/release/bundle/nsis/KYNESTRA-Setup.exe" -Force

      - name: Validate installer
        shell: pwsh
        run: |
          $installer = Get-Item "target/release/bundle/nsis/KYNESTRA-Setup.exe"
          if ($installer.Length -lt 100KB) {
            throw "Installer is unexpectedly small: $($installer.Length) bytes."
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  KYNESTRA-Setup.exe" | Set-Content "target/release/bundle/nsis/KYNESTRA-Setup.exe.sha256" -Encoding ascii
          Write-Host "KYNESTRA-Setup.exe: $($installer.Length) bytes"
          Write-Host "SHA-256: $hash"

      - name: Verify Windows signature
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $installer = Get-Item "target/release/bundle/nsis/KYNESTRA-Setup.exe"
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") { throw "KYNESTRA installer signature is not valid: $($signature.Status)" }
          if (-not $signature.SignerCertificate.Subject) { throw "KYNESTRA installer has no signer certificate." }
          Write-Host "Signed by: $($signature.SignerCertificate.Subject)"
          Write-Host "Signature status: $($signature.Status)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KYNESTRA-Windows-Installer
          path: |
            KYNESTRA/desktop/tauri/target/release/bundle/nsis/KYNESTRA-Setup.exe
            KYNESTRA/desktop/tauri/target/release/bundle/nsis/KYNESTRA-Setup.exe.sha256
          if-no-files-found: error

      - name: Publish installer to repository
        if: github.ref == 'refs/heads/kynestra-build'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/KYNESTRA/releases" | Out-Null
          Copy-Item "target/release/bundle/nsis/KYNESTRA-Setup.exe" "$env:GITHUB_WORKSPACE/KYNESTRA/releases/KYNESTRA-Setup.exe" -Force
          Set-Location $env:GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "KYNESTRA/releases/KYNESTRA-Setup.exe"
          if (-not (git diff --cached --quiet)) {
            git commit -m "build: publish KYNESTRA Windows installer"
            git push
          }

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "KYNESTRA $tag" --notes "Windows installer for KYNESTRA."
          }
          gh release upload $tag "target/release/bundle/nsis/KYNESTRA-Setup.exe" --clobber
