# Publishes the website to GitHub Pages after the required checks pass.

name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for repository validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate routes, markup, metadata, and runtime scripts
        run: node tools/validate_site.mjs

      - name: Validate TRILYVA render controls
        run: node tools/validate_trilyva_renderers.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
