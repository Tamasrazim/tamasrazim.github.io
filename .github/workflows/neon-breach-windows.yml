name: NEON VAULT Windows Build

on:
  push:
    branches: [main]
    paths:
      - "projects/razim-fps/**"
      - ".github/workflows/neon-breach-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neon-vault-windows
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S projects/razim-fps -B projects/razim-fps/build -G "Visual Studio 18 2026" -A x64

      - name: Build game
        run: cmake --build projects/razim-fps/build --config Release --parallel

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force projects/razim-fps/installer-output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "projects/razim-fps/installer.iss"

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path "projects/razim-fps/build/Release/neon_vault.exe" -DestinationPath "NEON-VAULT-Portable.zip" -Force

      - name: Verify installer outputs
        shell: pwsh
        run: |
          $installer = "projects/razim-fps/installer-output/NEON-VAULT-Setup.exe"
          $portable = "NEON-VAULT-Portable.zip"
          if (!(Test-Path $installer)) { throw "Installer was not generated: $installer" }
          if (!(Test-Path $portable)) { throw "Portable package was not generated: $portable" }
          if ((Get-Item $installer).Length -lt 100KB) { throw "Installer is suspiciously small." }
          if ((Get-Item $portable).Length -lt 10KB) { throw "Portable package is suspiciously small." }
          Write-Host "Installer: $((Get-Item $installer).Length) bytes"
          Write-Host "Portable:  $((Get-Item $portable).Length) bytes"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NEON-VAULT-Windows
          path: |
            projects/razim-fps/installer-output/NEON-VAULT-Setup.exe
            NEON-VAULT-Portable.zip

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "neon-vault-$env:GITHUB_RUN_NUMBER"
          gh release create $tag "projects/razim-fps/installer-output/NEON-VAULT-Setup.exe" "NEON-VAULT-Portable.zip" --title "NEON VAULT $tag" --generate-notes
