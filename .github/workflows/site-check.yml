# Checks the main website and shared assets for missing or broken pieces.

name: Site Check

on:
  push:
    paths:
      - 'index.html'
      - '404.html'
      - 'code-motion-tamasrazim*.html'
      - 'KYNESTRA/**'
      - 'licences/**'
      - 'LICENSES/**'
      - 'work/**'
      - 'about/**'
      - 'approach/**'
      - 'projects/**'
      - 'sitemap.xml'
      - 'README.md'
      - 'robots.txt'
      - '.github/workflows/pages.yml'
      - 'renderer/**'
      - 'asset-vault/**'
      - 'assets/**'
      - 'tools/validate_site.mjs'
      - 'tools/validate_vectyz.mjs'
      - 'tools/validate_trilyva_availability.mjs'
      - '.github/workflows/site-check.yml'
  pull_request:
    paths:
      - '404.html'
      - 'code-motion-tamasrazim*.html'
      - 'KYNESTRA/**'
      - 'licences/**'
      - 'LICENSES/**'
      - 'index.html'
      - 'work/**'
      - 'about/**'
      - 'approach/**'
      - 'projects/**'
      - 'sitemap.xml'
      - 'README.md'
      - 'robots.txt'
      - '.github/workflows/pages.yml'
      - 'renderer/**'
      - 'asset-vault/**'
      - 'assets/**'
      - 'tools/validate_site.mjs'
      - 'tools/validate_vectyz.mjs'
      - 'tools/validate_trilyva_availability.mjs'
      - '.github/workflows/site-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Vectyz-only changes
        id: scope
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          vectyz_only=true
          while IFS= read -r file; do
            case "$file" in
              projects/vectyz/*|.github/workflows/pages.yml|.github/workflows/site-check.yml|tools/validate_vectyz.mjs) ;;
              *) vectyz_only=false; break ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          echo "vectyz_only=$vectyz_only" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Vectyz browser workspace
        if: steps.scope.outputs.vectyz_only == 'true'
        run: |
          node --check projects/vectyz/app.js
          node --check projects/vectyz/db.js
          node --check projects/vectyz/vector-engine.js
          node --check projects/vectyz/vector-worker.js
          node --check projects/vectyz/sw.js
          node tools/validate_vectyz.mjs
      - name: Validate site routes, DOM ids and runtime scripts
        if: steps.scope.outputs.vectyz_only != 'true'
        run: node tools/validate_site.mjs
      - name: Validate TRILYVA availability
        if: steps.scope.outputs.vectyz_only != 'true'
        run: node tools/validate_trilyva_availability.mjs
