# Checks the main website and shared assets for missing or broken pieces.

name: Site Check

on:
  push:
    paths:
      - 'index.html'
      - '404.html'
      - 'code-motion-tamasrazim*.html'
      - 'KYNESTRA/**'
      - 'licences/**'
      - 'LICENSES/**'
      - 'work/**'
      - 'about/**'
      - 'approach/**'
      - 'projects/**'
      - 'sitemap.xml'
      - 'README.md'
      - 'robots.txt'
      - '.github/workflows/pages.yml'
      - 'renderer/**'
      - 'asset-vault/**'
      - 'assets/**'
      - 'tools/validate_site.mjs'
      - 'tools/validate_trilyva_renderers.mjs'
      - '.github/workflows/site-check.yml'
  pull_request:
    paths:
      - '404.html'
      - 'code-motion-tamasrazim*.html'
      - 'KYNESTRA/**'
      - 'licences/**'
      - 'LICENSES/**'
      - 'index.html'
      - 'work/**'
      - 'about/**'
      - 'approach/**'
      - 'projects/**'
      - 'sitemap.xml'
      - 'README.md'
      - 'robots.txt'
      - '.github/workflows/pages.yml'
      - 'renderer/**'
      - 'asset-vault/**'
      - 'assets/**'
      - 'tools/validate_site.mjs'
      - 'tools/validate_trilyva_renderers.mjs'
      - '.github/workflows/site-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate site routes, DOM ids and runtime scripts
        run: node tools/validate_site.mjs
      - name: Validate TRILYVA render controls
        run: node tools/validate_trilyva_renderers.mjs
