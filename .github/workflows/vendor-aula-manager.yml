name: Vendor full AULA-Manager repo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-aula-manager.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone upstream AULA-Manager
        run: |
          rm -rf vendor/aula-manager-full
          mkdir -p vendor
          git clone --depth 1 https://github.com/free-soldier28/Aula-Manager.git vendor/aula-manager-full
          rm -rf vendor/aula-manager-full/.git

      - name: Commit full upstream tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/aula-manager-full
          if git diff --cached --quiet; then
            echo "No vendor changes."
            exit 0
          fi
          git commit -m "vendor: add full AULA-Manager upstream tree"
          git push
