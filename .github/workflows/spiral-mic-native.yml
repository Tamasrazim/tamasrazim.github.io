name: Build Spiral Mic Native

on:
  push:
    paths:
      - "projects/spiral-mic/native/**"
      - "projects/spiral-mic/ui/**"
      - ".github/workflows/spiral-mic-native.yml"
  workflow_dispatch:

concurrency:
  group: spiral-mic-native
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/spiral-mic/native

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo binstall tauri-cli@2.12.1 --no-confirm

      - name: Cargo check
        run: cargo check

      - name: Build Windows installers
        run: cargo tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: spiral-mic-windows
          path: |
            projects/spiral-mic/native/target/release/bundle/nsis/*.exe
            projects/spiral-mic/native/target/release/bundle/msi/*.msi
