name: TRILYVA Desktop Build

on:
  push:
    branches:
      - main
      - trilyva-desktop-**
    paths:
      - "TRILYVA/**"
      - "projects/code-motion/renderer/**"
      - "assets/brand/trilyva/T.svg"
      - ".github/workflows/trilyva-desktop.yml"
  pull_request:
    paths:
      - "TRILYVA/**"
      - "projects/code-motion/renderer/**"
      - "assets/brand/trilyva/T.svg"
      - ".github/workflows/trilyva-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 / MSI + NSIS
    runs-on: windows-latest
    defaults:
      run:
        working-directory: TRILYVA/desktop/tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "TRILYVA/desktop/tauri -> target"

      - name: Prepare bundled FFmpeg and FFprobe
        shell: pwsh
        run: ./scripts/prepare-ffmpeg.ps1

      - name: Apply Rust formatting
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2.0"

      - name: Build Windows installers
        run: cargo tauri build --bundles nsis,msi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: TRILYVA-Windows-x64-${{ github.sha }}
          path: |
            TRILYVA/desktop/tauri/target/release/bundle/nsis/*.exe
            TRILYVA/desktop/tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
