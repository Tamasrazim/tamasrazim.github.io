name: Renderer Check

on:
  push:
    paths:
      - "projects/code-motion/**"
      - "tools/validate_code_motion.mjs"
      - ".github/workflows/renderer-check.yml"
  pull_request:
    paths:
      - "projects/code-motion/**"
      - "tools/validate_code_motion.mjs"
      - ".github/workflows/renderer-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical TRILYVA renderer
        run: node tools/validate_code_motion.mjs
